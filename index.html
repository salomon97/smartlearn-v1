<style>
:root{
  /* Navy — Suite umbrella */
  --color-navy-50:#F0F3F8;--color-navy-100:#D6DDE9;--color-navy-200:#A9B6CB;--color-navy-300:#7C8FAE;--color-navy-400:#4F6791;--color-navy-500:#1A2840;--color-navy-600:#0A1628;--color-navy-700:#050D1A;--color-navy-800:#03080F;--color-navy-900:#010407;
  /* Orange — Product (School) */
  --color-school-50:#FFF1E6;--color-school-100:#FFE4CC;--color-school-200:#FFC599;--color-school-300:#FFA666;--color-school-400:#FB8333;--color-school-500:#F97316;--color-school-600:#EA580C;--color-school-700:#C2410C;--color-school-800:#9A3412;--color-school-900:#7C2D12;
  /* Neutrals */
  --color-neutral-0:#FFFFFF;--color-neutral-50:#F8FAFC;--color-neutral-100:#F1F5F9;--color-neutral-200:#E2E8F0;--color-neutral-300:#CBD5E1;--color-neutral-400:#94A3B8;--color-neutral-500:#64748B;--color-neutral-600:#475569;--color-neutral-700:#334155;--color-neutral-800:#1E293B;--color-neutral-900:#0F172A;
  /* Semantic */
  --color-success-50:#ECFDF5;--color-success-100:#D1FAE5;--color-success-500:#10B981;--color-success-700:#047857;
  --color-warning-50:#FFFBEB;--color-warning-500:#F59E0B;--color-warning-700:#B45309;
  --color-danger-50:#FEF2F2;--color-danger-500:#DC2626;--color-danger-700:#991B1B;
  --color-info-50:#EFF6FF;--color-info-500:#3B82F6;--color-info-700:#1D4ED8;
  /* Aliases */
  --bg-canvas:var(--color-neutral-50);--bg-surface:var(--color-neutral-0);--bg-surface-sunken:var(--color-neutral-100);
  --text-primary:var(--color-navy-600);--text-secondary:var(--color-neutral-600);--text-tertiary:var(--color-neutral-500);--text-inverse:var(--color-neutral-0);
  --border-subtle:var(--color-neutral-200);--border-default:var(--color-neutral-300);
  --color-product-soft:var(--color-school-50);
  /* Type */
  --font-serif:'Playfair Display',Georgia,serif;--font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--font-accent:'Bricolage Grotesque','DM Sans',sans-serif;--font-mono:'JetBrains Mono','Menlo',monospace;
  /* Radius */
  --radius-md:8px;--radius-button:8px;--radius-card:12px;--radius-card-large:16px;--radius-chip:9999px;--radius-tag:6px;--radius-full:9999px;
  /* Shadows */
  --shadow-elev-1:0 1px 2px 0 rgba(10,22,40,.05);
  --shadow-elev-2:0 2px 4px -1px rgba(10,22,40,.06),0 1px 2px 0 rgba(10,22,40,.04);
  --shadow-elev-4:0 12px 24px -4px rgba(10,22,40,.10),0 4px 8px -2px rgba(10,22,40,.06);
  --shadow-focus-ring:0 0 0 3px rgba(249,115,22,.30);
}
*{box-sizing:border-box;}
html{font-family:var(--font-sans);font-size:16px;line-height:1.5;color:var(--text-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth;}
body{margin:0;background:var(--bg-canvas);color:var(--text-primary);font-size:15px;line-height:1.55;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{margin:0;}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;}
.kicker{font-family:var(--font-accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--color-school-600);}
.serif{font-family:var(--font-serif);}
.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--color-school-500);outline-offset:2px;box-shadow:var(--shadow-focus-ring);border-radius:4px;}

/* Header */
header.site{position:sticky;top:0;z-index:50;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);}
header.site .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0;}
.brand{display:flex;align-items:baseline;gap:8px;color:var(--text-primary);}
.brand .name{font-family:var(--font-serif);font-size:20px;font-weight:700;}
nav.links{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
nav.links a{color:var(--text-secondary);font-size:14px;font-weight:500;}
nav.links a:hover{color:var(--color-school-600);}
.head-actions{display:flex;align-items:center;gap:12px;}
.lang-btn{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:32px;padding:0 10px;border-radius:var(--radius-button);background:var(--bg-surface);border:1px solid var(--border-default);color:var(--text-primary);font-family:var(--font-sans);font-weight:600;font-size:13px;cursor:pointer;transition:background .1s,border-color .1s;}
.lang-btn:hover{background:var(--bg-surface-sunken);}
.btn-cta{display:inline-flex;align-items:center;padding:9px 16px;border-radius:var(--radius-button);background:var(--color-school-500);color:var(--text-inverse);font-weight:500;font-size:14px;box-shadow:var(--shadow-elev-1);transition:background .1s;}
.btn-cta:hover{background:var(--color-school-600);}

/* Hero */
.hero{padding:clamp(48px,7vw,88px) 0 clamp(32px,4vw,48px);}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,64px);align-items:center;}
.hero h1{font-family:var(--font-serif);font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.02em;font-weight:800;margin:0 0 22px;color:var(--text-primary);}
.hero .lead{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--text-secondary);max-width:44ch;margin:0 0 28px;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px;}
.btn-primary{display:inline-flex;align-items:center;padding:14px 22px;border-radius:var(--radius-button);background:var(--color-school-500);color:var(--text-inverse);font-weight:600;font-size:15px;box-shadow:var(--shadow-elev-1);transition:background .1s;}
.btn-primary:hover{background:var(--color-school-600);}
.btn-secondary{display:inline-flex;align-items:center;padding:14px 22px;border-radius:var(--radius-button);background:var(--bg-surface);color:var(--text-primary);font-weight:600;font-size:15px;border:1px solid var(--border-default);transition:border-color .1s;}
.btn-secondary:hover{border-color:var(--text-primary);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:500;color:var(--text-secondary);background:var(--bg-surface-sunken);border:1px solid var(--border-subtle);padding:6px 13px;border-radius:var(--radius-chip);}
.portrait-wrap{position:relative;justify-self:center;}
.portrait{border:1px solid var(--border-subtle);border-radius:var(--radius-card-large);overflow:hidden;box-shadow:var(--shadow-elev-4);background:var(--bg-surface);max-width:420px;}
.portrait img{display:block;width:100%;height:auto;object-fit:cover;}
.avail{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--radius-full);background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:var(--shadow-elev-2);}
.avail .dot{width:8px;height:8px;border-radius:50%;background:var(--color-success-500);box-shadow:0 0 0 3px var(--color-success-100);}
.avail span.t{font-size:13px;font-weight:600;color:var(--text-primary);}
.proof{margin-top:clamp(40px,5vw,64px);padding-top:28px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:24px 40px;flex-wrap:wrap;}
.proof .items{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.proof .items span{font-family:var(--font-serif);font-size:17px;font-weight:600;color:var(--text-secondary);}

/* Sections */
section.band{background:var(--bg-surface);border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);}
.sec-pad{padding-top:clamp(56px,7vw,96px);padding-bottom:clamp(56px,7vw,96px);}
.sec-title{font-family:var(--font-serif);font-size:clamp(26px,3.4vw,40px);line-height:1.1;letter-spacing:-.015em;font-weight:800;max-width:20ch;margin:0 0 12px;}
.sec-lead{font-size:16px;line-height:1.6;color:var(--text-secondary);max-width:56ch;margin:0 0 40px;}

/* About */
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px 48px;align-items:start;}
.about-body{display:flex;flex-direction:column;gap:18px;}
.about-body p{font-size:16px;line-height:1.65;color:var(--text-secondary);margin:0;}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.stat{border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:var(--bg-canvas);padding:20px;}
.stat .v{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--color-school-600);line-height:1;}
.stat .l{font-size:13px;color:var(--text-tertiary);margin-top:8px;line-height:1.4;}

/* Expertise */
.poles{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:20px;}
.pole{border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:var(--bg-surface);padding:26px;box-shadow:var(--shadow-elev-1);display:flex;flex-direction:column;gap:14px;}
.pole-ic{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--radius-md);background:var(--color-product-soft);color:var(--color-school-600);}
.pole h3{font-size:18px;font-weight:700;color:var(--text-primary);}
.pole p{font-size:14px;line-height:1.55;color:var(--text-secondary);margin:0;}
.pole-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px;}
.pole-tags span{font-size:12px;font-weight:500;color:var(--text-tertiary);background:var(--bg-surface-sunken);padding:5px 10px;border-radius:var(--radius-chip);}
.ai-ribbon{margin-top:24px;border:1px solid var(--color-navy-500);border-radius:var(--radius-card-large);background:var(--color-navy-600);color:var(--text-inverse);padding:clamp(28px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 48px;align-items:center;}
.ai-ribbon h3{font-family:var(--font-serif);font-size:clamp(22px,2.6vw,30px);line-height:1.15;font-weight:700;margin:0 0 14px;color:var(--text-inverse);}
.ai-ribbon p{font-size:15px;line-height:1.6;color:var(--color-navy-100);margin:0;}
.ai-tags{display:flex;gap:10px;flex-wrap:wrap;}
.ai-tags span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--color-navy-100);background:var(--color-navy-500);border:1px solid var(--color-navy-400);padding:8px 14px;border-radius:var(--radius-chip);}
.ai-tags span .d{width:6px;height:6px;border-radius:50%;background:var(--color-school-500);}

/* Projects */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;}
.proj{border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:var(--bg-canvas);padding:26px;display:flex;flex-direction:column;gap:14px;}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--radius-tag);width:fit-content;}
.badge.success{background:var(--color-success-50);color:var(--color-success-700);}
.badge.warning{background:var(--color-warning-50);color:var(--color-warning-700);}
.badge.info{background:var(--color-info-50);color:var(--color-info-700);}
.badge.product{background:var(--color-school-50);color:var(--color-school-700);}
.badge.neutral{background:var(--color-neutral-100);color:var(--color-neutral-600);}
.proj h3{font-size:20px;font-weight:700;color:var(--text-primary);}
.proj p{font-size:14px;line-height:1.55;color:var(--text-secondary);margin:0;}
.proj-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
.proj-tags span{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--text-tertiary);background:var(--bg-surface-sunken);padding:4px 9px;border-radius:var(--radius-tag);}
.proj-link{margin-top:auto;padding-top:6px;font-size:14px;font-weight:600;color:var(--color-school-600);}

/* Services */
.serv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.serv{border:1px solid var(--border-subtle);border-radius:var(--radius-card);background:var(--bg-surface);padding:24px;box-shadow:var(--shadow-elev-1);display:flex;gap:16px;align-items:flex-start;}
.serv-ic{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-md);background:var(--color-product-soft);color:var(--color-school-600);}
.serv h3{font-size:16px;font-weight:700;margin:0 0 6px;color:var(--text-primary);}
.serv p{font-size:14px;line-height:1.55;color:var(--text-secondary);margin:0;}

/* Contact */
section.contact{background:var(--color-navy-600);color:var(--text-inverse);}
section.contact .kicker{color:var(--color-school-400);}
section.contact h2{font-family:var(--font-serif);font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.015em;font-weight:800;max-width:16ch;margin:0 0 16px;color:var(--text-inverse);}
section.contact .lead{font-size:17px;line-height:1.6;color:var(--color-navy-100);max-width:52ch;margin:0 0 36px;}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:12px;}
.c-method{display:flex;align-items:center;gap:14px;border:1px solid var(--color-navy-500);border-radius:var(--radius-card);background:var(--color-navy-700);padding:18px;color:var(--text-inverse);transition:border-color .1s;}
.c-method:hover{border-color:var(--color-school-400);}
.c-ic{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-md);background:var(--color-navy-500);color:var(--color-school-400);}
.c-method .lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-navy-200);font-family:var(--font-accent);}
.c-method .val{display:block;font-size:14px;font-weight:600;color:var(--text-inverse);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.foot{margin-top:48px;padding-top:24px;border-top:1px solid var(--color-navy-500);font-size:13px;color:var(--color-navy-200);}

@media (max-width:640px){
  nav.links{display:none;}
  .stats{grid-template-columns:1fr 1fr;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important;}
}
</style>
